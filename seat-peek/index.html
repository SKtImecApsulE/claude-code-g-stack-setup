<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0e1320" />
    <title>SeatPeek - see your train seat before you book</title>
  </head>
  <body>
    <main id="home" class="home"></main>

    <main id="booking" class="booking" hidden>
      <header class="bar">
        <button id="back" class="icon-btn" aria-label="Back to trains">&#8592;</button>
        <div class="bar-title">
          <strong id="trainName"></strong>
          <span id="trainMeta"></span>
        </div>
      </header>
      <nav id="coaches" class="coaches" aria-label="Coaches"></nav>

      <section class="stage" id="stage">
        <canvas id="view" aria-label="3D view from the seat"></canvas>
        <div class="stage-top">
          <span id="viewLabel" class="badge"></span>
          <span class="spacer"></span>
          <button id="timeBtn" class="pill" aria-label="Change time of day"></button>
          <button id="expandBtn" class="pill" aria-label="Toggle full screen view">&#x26F6;</button>
        </div>
        <p id="hint" class="hint">Drag to look around</p>
        <div class="stage-bottom" id="lookBtns">
          <button data-look="window" class="pill">Window</button>
          <button data-look="ahead" class="pill">Ahead</button>
          <button data-look="aisle" class="pill">Aisle</button>
          <button data-look="coach" class="pill">Coach</button>
        </div>
      </section>

      <section class="panel">
        <div id="map" class="map"></div>
        <div id="seatCard" class="seat-card"></div>
      </section>
    </main>

    <dialog id="confirm" class="confirm"></dialog>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
